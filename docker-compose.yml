services:
  ai-dev:
    build: .
    container_name: ai-dev

    ports:
      - "2222:22"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
      - "8086:8086"
      - "8087:8087"
      - "8088:8088"
      - "8089:8089"

    volumes:
      - ./workspace:/workspace
      - ai-home:/home/dev
      - ./.ssh/authorized_keys:/home/dev/.ssh/authorized_keys:ro

    environment:
      - TZ=Asia/Tokyo
      - OPENCODE_MODEL=${OPENCODE_MODEL:-opencode-go/deepseek-v4-flash}

    secrets:
      - github_token
      - github_username
      - gitlab_token
      - gitlab_username
      - opencode_zen_api_key
      - opencode_go_api_key

    restart: unless-stopped

secrets:
  github_token:
    file: ./secrets/github_token
  github_username:
    file: ./secrets/github_username
  gitlab_token:
    file: ./secrets/gitlab_token
  gitlab_username:
    file: ./secrets/gitlab_username
  opencode_zen_api_key:
    file: ./secrets/opencode_zen_api_key
  opencode_go_api_key:
    file: ./secrets/opencode_go_api_key

volumes:
  ai-home:
